<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Doorway vs logo review</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #e8eef5;
        color: #0b2f5c;
      }
      h1 {
        text-align: center;
        font-size: 1rem;
        font-weight: 600;
        padding: 1rem;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 0.75rem;
        max-width: 1100px;
        margin: 0 auto;
        padding: 1rem;
      }
      figure {
        margin: 0;
        background: #fff;
        border-radius: 12px;
        padding: 1rem;
        text-align: center;
      }
      figcaption {
        margin-top: 0.75rem;
        font-size: 0.8rem;
        font-weight: 700;
      }
      img,
      svg {
        width: min(100%, 240px);
        height: auto;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <h1>Brand logo vs animation open pose vs logo-mark.svg</h1>
    <div class="row">
      <figure>
        <img src="../src/assets/brand/logo-full.jpg" alt="logo-full" />
        <figcaption>logo-full (your screenshot)</figcaption>
      </figure>
      <figure>
        <svg viewBox="0 0 128 128">
          <defs>
            <radialGradient id="g" cx="58%" cy="42%" r="48%">
              <stop offset="0%" stop-color="#FFFFFF" />
              <stop offset="40%" stop-color="#FFF6C8" stop-opacity="0.95" />
              <stop offset="100%" stop-color="#0B2F5C" stop-opacity="0" />
            </radialGradient>
            <linearGradient id="b" x1="0.55" y1="0.2" x2="0.2" y2="1">
              <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
              <stop offset="55%" stop-color="#DCE8F5" stop-opacity="0.35" />
              <stop offset="100%" stop-color="#0B2F5C" stop-opacity="0" />
            </linearGradient>
          </defs>
          <ellipse cx="72" cy="58" rx="28" ry="36" fill="url(#g)" />
          <polygon points="58,30 82,30 48,118 18,118" fill="url(#b)" opacity="0.7" />
          <path
            fill="#0B2F5C"
            d="M46 22h34c20 0 34 13 34 32s-14 32-34 32H64v42H46V22zm18 48h16c8 0 14-5 14-12s-6-12-14-12H64v24z"
          />
          <path d="M46 22 L22 38 L18 98 L42 118 Z" fill="#163E72" />
          <circle cx="28" cy="70" r="3.2" fill="#F4F7FB" />
        </svg>
        <figcaption>animation open (door above P)</figcaption>
      </figure>
      <figure>
        <img src="../src/assets/brand/logo-mark.svg" alt="logo-mark" />
        <figcaption>logo-mark.svg</figcaption>
      </figure>
    </div>
  </body>
</html>
