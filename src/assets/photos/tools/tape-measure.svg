<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="Tape measure">
  <rect width="320" height="240" fill="#f4f7fb"/>
  <!-- case -->
  <rect x="58" y="58" width="130" height="124" rx="22" fill="#f0c419"/>
  <rect x="68" y="68" width="110" height="104" rx="16" fill="#e8a317"/>
  <!-- lock button -->
  <rect x="148" y="88" width="18" height="28" rx="4" fill="#3d5168"/>
  <!-- reel -->
  <circle cx="118" cy="120" r="34" fill="#fff6c8"/>
  <circle cx="118" cy="120" r="22" fill="#0b2f5c"/>
  <circle cx="118" cy="120" r="8" fill="#f5c542"/>
  <!-- belt clip -->
  <rect x="178" y="92" width="12" height="56" rx="3" fill="#3d5168"/>
  <!-- extended tape -->
  <rect x="186" y="108" width="112" height="28" rx="3" fill="#fff8d6" stroke="#c2a24a" stroke-width="2"/>
  <g stroke="#0b2f5c" stroke-width="1.5">
    <line x1="206" y1="108" x2="206" y2="136"/>
    <line x1="226" y1="108" x2="226" y2="136"/>
    <line x1="246" y1="108" x2="246" y2="136"/>
    <line x1="266" y1="108" x2="266" y2="136"/>
    <line x1="286" y1="108" x2="286" y2="136"/>
  </g>
  <g fill="#0b2f5c" font-family="Barlow, Arial, sans-serif" font-size="12" font-weight="700">
    <text x="200" y="128">1</text>
    <text x="220" y="128">2</text>
    <text x="240" y="128">3</text>
    <text x="260" y="128">4</text>
    <text x="280" y="128">5</text>
  </g>
</svg>
