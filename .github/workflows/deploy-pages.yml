name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install API deps (neural TTS bake)
        run: npm ci --prefix server

      - name: Bake Edge neural TTS for Practice Mode (static Pages audio)
        # Skip force re-bake of Logistics clips on every deploy — use cached public/tts.
        # Set BAKE_FORCE_LOGISTICS=1 manually when intentionally refreshing worksheet audio.
        env:
          BAKE_FORCE_LOGISTICS: '0'
        run: npm run bake:tts
        continue-on-error: true

      - name: Build site
        env:
          GITHUB_PAGES: 'true'
          # Apex custom domain (Cloudflare → GitHub Pages). Assets load from /.
          PAGES_BASE: '/'
          # Live Render API; override with repo variable VITE_API_URL if needed.
          # Pages also ships baked /tts clips for instant vocab audio on cold starts.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://purpose-academy-api.onrender.com' }}
        run: npm run build

      - name: Add SPA fallback for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          # Ensure custom domain file is present in the artifact
          test -f dist/CNAME || echo 'purposeacademy.ca' > dist/CNAME
          cat dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
