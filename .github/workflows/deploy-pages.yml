name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install API deps (neural TTS bake)
        run: npm ci --prefix server

      - name: Bake Edge neural TTS for Practice Mode (static Pages audio)
        env:
          BAKE_FORCE_LOGISTICS: '0'
        run: npm run bake:tts
        continue-on-error: true

      - name: Build site
        env:
          GITHUB_PAGES: 'true'
          PAGES_BASE: '/Purpose-Academy-Application/'
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://purpose-academy-api.onrender.com' }}
        run: npm run build

      - name: Add SPA fallback for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          rm -f dist/CNAME

      # Branch publish — avoids actions/deploy-pages hanging on "updating_pages"
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
